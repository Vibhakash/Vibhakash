<svg width="495" height="170" viewBox="0 0 495 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #ff70a6;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #e4e2e2;
    }
    .pct {
      font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #a9fef7;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect x="0.5" y="0.5" rx="6" height="169" width="494" fill="#141321" stroke="#e4e2e2" stroke-opacity="0.1"/>

  <!-- Title -->
  <text x="25" y="38" class="header">My Programming Languages</text>

  <!-- Divider -->
  <line x1="25" y1="48" x2="470" y2="48" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Progress Bar (total width = 445px, starting at x=25) -->
  <!-- Python: 89% = 396px  -->
  <!-- TypeScript: 11% = 49px -->
  <mask id="bar-mask">
    <rect x="25" y="58" width="445" height="10" fill="white" rx="5"/>
  </mask>
  <rect mask="url(#bar-mask)" x="25"  y="58" width="396" height="10" fill="#FFD43B"/>
  <rect mask="url(#bar-mask)" x="421" y="58" width="49"  height="10" fill="#7B68EE"/>

  <!-- Row 1: Python -->
  <circle cx="33"  cy="92" r="6" fill="#FFD43B"/>
  <text x="45"  y="97" class="lang-name">Python</text>
  <text x="108" y="97" class="pct">(89.00%)</text>

  <!-- Row 1: TypeScript -->
  <circle cx="220" cy="92" r="6" fill="#7B68EE"/>
  <text x="232" y="97" class="lang-name">TypeScript</text>
  <text x="310" y="97" class="pct">(11.00%)</text>

  <!-- Row 2: CSS (minor) -->
  <circle cx="33"  cy="125" r="6" fill="#FF69B4"/>
  <text x="45"  y="130" class="lang-name">CSS</text>
  <text x="75"  y="130" class="pct">(&lt;1%)</text>

  <!-- Row 2: JavaScript (minor) -->
  <circle cx="220" cy="125" r="6" fill="#E8A838"/>
  <text x="232" y="130" class="lang-name">JavaScript</text>
  <text x="310" y="130" class="pct">(&lt;1%)</text>

  <!-- Row 3: Java (minor) -->
  <circle cx="33" cy="158" r="6" fill="#ED8B00"/>
  <text x="45"  y="163" class="lang-name">Java</text>
  <text x="80"  y="163" class="pct">(&lt;1%)</text>
</svg>
